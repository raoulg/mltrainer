pre-commit:
  commands:
    isort:
      files: git ls-files
      glob: '*.py'
      run: isort {staged_files}
      stage_fixed: true
    format:
      files: git ls-files
      glob: '*.{py, ipynb}'
      run: ruff format {staged_files}
      stage_fixed: true
    lint:
      files: git ls-files
      glob: '*.py'
      run: ruff check {staged_files} --fix
      stage_fixed: true
    typecheck:
      files: git ls-files
      glob: '*.py'
      run: ty check {staged_files}
      stage_fixed: true
    test:
      run: pytest

pre-merge:
  commands:
    isort:
      glob: '*.py'
      run: isort {all_files}
      stage_fixed: true
    format:
      glob: '*.{py, ipynb}'
      run: ruff format {all_files}
      stage_fixed: true
    lint:
      glob: '*.py'
      run: ruff check {all_files} --fix
      stage_fixed: true
    typecheck:
      glob: '*.py'
      run: ty check {staged_files}
      stage_fixed: true
    test:
      run: pytest
