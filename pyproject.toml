
[project]
name = "mltrainer"
version = "0.3.5"
description = "toolkit for training pytorch models"

authors = [
    {name = "R.Grouls", email = "Raoul.Grouls@han.nl"},
]

requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python",
    "Typing :: Typed",
]

dependencies = [
    "loguru>=0.7.0",
    "mlflow<3.6.0",
    "numpy>=1.25.0",
    "psutil>=7.0.0",
    "pydantic>=1.10.9",
    "pytest-cov>=6.0.0",
    "tensorboard>=2.18.0",
    "tomlserializer>=0.3.0",
    "torch>=2.6.0",
    "torch-tb-profiler>=0.4.1",
    "torchvision>=0.21.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
tune = ["ray[tune]>=2.45.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mltrainer"]

[project.urls]
GitHub = "https://github.com/raoulg/mltrainer"

[dependency-groups]
dev = [
    "isort>=5.13.2",
    "pytest>=8.3.4",
    "ruff>=0.9.2",
    "ty>=0.0.11",
]

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
	filterwarnings = [
    "ignore::pydantic.PydanticDeprecatedSince20"
]
addopts = "-ra -v --cov=mltrainer --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "tensorboard: marks tests that use tensorboard functionality",
    "ray: marks tests that start a real ray cluster (slow; run with -m ray)",
]

[tool.coverage.run]
source = ["mltrainer"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\.",
]
show_missing = true
skip_empty = true
